preprocess:
  fs: 44100
  get_spec: get_spec
  num_freq_bins: 128
  num_time_bins: 64
  nperseg: 512
  noverlap: 256
  max_dur: 1000000000.0
  window_length: 0.03
  min_freq: 300.0
  max_freq: 10000.0
  spec_min_val: 1.0
  spec_max_val: 6.5
  mel: true
  time_stretch: false
  within_syll_normalize: false
  normalization_mode: global
  normalization_method: robust
  normalization_num_samples: 512
  normalization_seed: 0
  entry_weight_mode: regime_bird_uniform
  file_weight_mode: duration
  file_weight_cap:
  roi_weight_mode: duration
  sequence_hop_length:
  sequence_shoulder: 0.05
  sampling_seed: 0
  log_window_indices: false
  real_preprocess_params:
    - min_freq
    - max_freq
    - spec_min_val
    - spec_max_val
  int_preprocess_params: []
  binary_preprocess_params:
    - mel
    - within_syll_normalize

data:
  batch_size: 128
  num_workers: 4
  shuffle_train: true
  shuffle_test: false
  min_spec_val:
  min_audio_energy:
  spec_cache_dir: /tmp/ava_spec_cache_transport_shared_30ms
  audio_cache_size: 16
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

training:
  lr: 0.001
  z_dim: 32
  model_precision: 10.0
  learn_observation_scale: false
  log_precision_min:
  log_precision_max:
  posterior_logvar_min:
  posterior_logvar_max:
  epochs: 100
  test_freq: 5
  save_freq: 5
  vis_freq: 5
  num_specs: 5
  gap:
    - 2
    - 6
  vis_filename: reconstruction_transport_shared_30ms.pdf
  posterior_type: diag
  conv_arch: residual
  kl_beta: 1.0
  kl_warmup_epochs: 20
  compile_model: false
  trainer_kwargs:
    accelerator: gpu
    devices: 1
    precision: 16-mixed
    log_every_n_steps: 25
  stopping_kwargs:
    min_epochs: 25
    val_patience: 6
    val_min_delta: 0.001
    recon_patience: 6
    recon_min_delta: 0.0001
    collapse_patience: 2
    collapse_mean_threshold: 0.01
    collapse_var_tolerance: 0.1
  invariance_weight: 0.0

augmentations:
  enabled: false
  seed:
  amplitude_scale:
    - 0.9
    - 1.1
  noise_std: 0.0
  time_shift_max_bins: 0
  freq_shift_max_bins: 0
  time_mask_max_bins: 0
  time_mask_count: 0
  freq_mask_max_bins: 0
  freq_mask_count: 0
